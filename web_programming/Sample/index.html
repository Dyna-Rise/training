<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>グループタグとid・class</title>
        <link rel="stylesheet" href="css/style.css" />
    </head>
    <body>
        <header>
            <h1>キッズロボ</h1>
            <p id="welcomeMessage"></p>
            <img src="img/student.jpg" alt="学習の様子" />
        </header>
        <main>
            <h2>伸びる3つの能力</h2>
            <div id="blue">
                <h3 class="emp">思考力</h3>
                <p>得られた知識をもとに筋道を立てて考える</p>
                <div id="stars1" data="3"></div>
            </div>
            <div id="pink">
                <h3 class="emp">判断力</h3>
                <p>情報を吟味し、適切なものを選択できる</p>
                <div id="stars2" data="4"></div>
            </div>
            <div id="yellow">
                <h3 class="emp">表現力</h3>
                <p>自分の考えを他者にわかりやすく伝える</p>
                <div id="stars3" data="5"></div>
            </div>

             <!-- Canvas要素をここに追加します -->
            <div class="canvas-section">
                <h3>今日の目標</h3>
                <canvas id="myCanvas" width="500" height="200" style="border:1px solid #000;"></canvas>
                <p>上記キャンバスにメッセージが表示されます。</p>
                <button id="updateCanvasText">メッセージを更新</button>
            </div>
            <!-- Canvas要素はここまで -->
             
        </main>
        <footer>
            <h2>申し込み</h2>
            <p>申し込みは<a href="">こちらから</a></p>
        </footer>

        <script src="js/script.js"></script>
    </body>
</html>
