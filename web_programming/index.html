<!DOCTYPE html>
<html lang="ja">

<head>
    <!-- Webサイトの裏設定を記入する場所 -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>初のWebサイト作成</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="inner">
        <!-- 実際にユーザーの目に触れる部分 -->
        <h1>これは練習ページです</h1>
        <p>はじめてのホームページ作りです。まずはHTMLファイルの中身を編集してWebサイトを作成します。その後、CSSデザインを学んで、JavaScriptでプログラミング制御します。</p>
        <!-- aタグはhrefという属性値でジャンプ先を示す -->
        <a href="https://github.com/">自分のGitHubページはこちらです</a>
        <br>
        <br>
        <br>
        <!-- 自動改行はAlt + Shift + F -->
        <p>↓は猫の写真でーす♪</p>

        <!-- src属性で画像ファイルを指名、alt属性で補足 -->
        <img src="cat.png" alt="ネコの画像">
    </div>

    <!-- script.jsという名前のJavaScriptと連動 -->
    <script src="script.js"></script>
</body>

</html>
